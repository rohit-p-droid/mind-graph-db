[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind-graph-db"
version = "0.1.0"
description = "A hybrid semantic + vector + graph database in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mind Graph DB Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "httpx>=0.24.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/mind_graph_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]
